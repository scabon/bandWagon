name: icons

# Rasterize the SVG icon master into the PNG sizes used by the
# extension manifest. Runs whenever icon.svg changes.
on:
  push:
    branches: [main]
    paths:
      - 'extension/icons/icon.svg'
      - '.github/workflows/icons.yml'

permissions:
  contents: write

jobs:
  png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rsvg-convert
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Rasterize
        run: |
          for size in 32 48 96 128; do
            rsvg-convert --background-color=white -w "$size" -h "$size" \
              extension/icons/icon.svg -o "extension/icons/icon-$size.png"
          done
      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/icons/*.png
          if git diff --staged --quiet; then
            echo "No PNG changes"
          else
            git commit -m "chore: regenerate icon PNGs from icon.svg"
            git push
          fi
